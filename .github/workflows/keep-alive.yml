# Keeps the free Supabase project from pausing.
# Every 3 days it reads one gig from the database (that counts as activity),
# then records the time in .keepalive so GitHub keeps this schedule switched on.
name: Keep Plug'd awake

on:
  schedule:
    - cron: "17 14 */3 * *"   # about 9:17 AM Eastern, every 3 days
  workflow_dispatch:           # adds a "Run workflow" button for testing

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check in with the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions."; exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/gigs?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Supabase didn't answer. If the project is paused, open supabase.com and click Restore."; exit 1

      - name: Record the check-in
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "plugd-keepalive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep-alive check-in" || echo "Nothing new to record"
          git push
