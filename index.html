<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07071a">
<title>Plug’d</title>
<meta name="description" content="Plug’d connects musicians, bands, engineers, DJs and hosts with paid gigs across NC, SC and VA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plug’d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sticky top bar, one content column (max 1100px), cards in auto-fill grids; detail pages split main + aside; calendar is a 7-column month grid */
  --ink:#07071a; --panel:#0f0f29; --panel2:#16163b; --line:#27274f;
  --text:#efedff; --muted:#a3a1cb;
  --blue:#2f7bff; --violet:#8b4dff; --peacock:#00b8a9; --gold:#e8b840;
  --good:#2fd39a; --warn:#ffb648; --bad:#ff6382;
  --display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{min-height:100%;background:
  radial-gradient(900px 420px at 85% -10%, rgba(139,77,255,.18), transparent 60%),
  radial-gradient(700px 380px at -10% 10%, rgba(0,184,169,.12), transparent 60%),
  var(--ink);background-attachment:fixed}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(1.6rem,4vw,2.5rem)}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--peacock);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

header.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(7,7,26,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand b{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs a{text-decoration:none;padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;border:1px solid transparent}
nav.tabs a:hover{color:var(--text);background:var(--panel2)}
nav.tabs a.on{color:var(--text);background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(90deg,var(--blue),var(--violet)) border-box}
.me-btn{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;white-space:nowrap;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;background:linear-gradient(95deg,var(--blue),var(--violet));color:#fff}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.ghost:hover{border-color:var(--peacock)}
.btn.teal{background:var(--peacock);color:#04201d}
.btn.gold{background:var(--gold);color:#241a00}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}

main{padding:28px 0 72px}
.note{border:1px solid var(--line);background:var(--panel);border-left:3px solid var(--gold);padding:10px 14px;border-radius:10px;margin-bottom:20px;font-size:.92rem}

.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding:8px 0 26px}
.hero .lede{color:var(--muted);max-width:52ch;margin-top:12px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--peacock);margin-bottom:10px}
.stats{display:flex;gap:10px;margin:0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:96px}
.stats dt{font-size:.78rem;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}

.nudge{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);margin-bottom:20px;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(90deg,var(--peacock),var(--blue),var(--violet)) border-box;border:1px solid transparent}

.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-bottom:14px}
.filters input[type=search]{flex:1 1 240px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.sel{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem}
.sel select{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--text);max-width:190px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:.9rem}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:700}
.toggle{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem;cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.gig{display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .15s,transform .15s}
.gig:hover{border-color:#3d3d74;transform:translateY(-1px)}
.gig h3 a{text-decoration:none}
.gig h3 a::after{content:"";position:absolute;inset:0}
.gig .poster{position:relative;z-index:1}
.gig-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:.92rem}
.pay{font-family:var(--display);font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums}
.pay small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400}
.pay .np{font-family:var(--body);font-size:.95rem;color:var(--muted);font-weight:500}
.gig-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:.9rem}
.poster{display:flex;align-items:center;gap:8px;text-decoration:none;min-width:0}
.poster .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.role{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:rgba(47,123,255,.16);color:#8fb6ff}
.role.r-vocalist{background:rgba(139,77,255,.18);color:#c5a6ff}
.role.r-sound-engineer{background:rgba(0,184,169,.16);color:#5fe3d7}
.role.r-band{background:rgba(0,184,169,.22);color:#9ff3ea;border:1px solid rgba(0,184,169,.4)}
.role.r-dj{background:rgba(232,184,64,.15);color:#f3d27e}
.role.r-host-mc,.role.r-organizer-venue{background:rgba(255,99,130,.14);color:#ff9fb4}
.etype{font-size:.78rem;color:var(--muted);font-weight:500}

.pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.open{color:var(--good)} .pill.applied{color:var(--blue)} .pill.booked{color:var(--gold)}
.pill.closed{color:var(--muted)} .pill.pending{color:var(--warn)} .pill.accepted{color:var(--good)}
.pill.declined{color:var(--muted)} .pill.offered{color:var(--blue)} .pill.completed{color:var(--peacock)}

.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--display);font-size:.7rem;font-weight:700;color:#fff;flex:none}
.av0{background:conic-gradient(from 200deg,var(--blue),var(--violet),var(--blue))}
.av1{background:conic-gradient(from 120deg,var(--peacock),var(--blue),var(--peacock))}
.av2{background:conic-gradient(from 40deg,var(--violet),var(--peacock),var(--gold),var(--violet))}
.av.lg{width:54px;height:54px;font-size:1rem}
.av.xl{width:84px;height:84px;font-size:1.5rem;box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--peacock)}
.av.vip{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold)}
.rmini{white-space:nowrap;color:var(--gold);font-weight:700;font-size:.88rem}
.stars{color:var(--gold);letter-spacing:1px}
.stars .off{color:#3a3a66}

.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tier::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tier.new{color:var(--muted);background:rgba(163,161,203,.1)}
.tier.rising{color:#8fb6ff;background:rgba(47,123,255,.14)}
.tier.trusted{color:#5fe3d7;background:rgba(0,184,169,.14)}
.tier.top{color:var(--gold);background:rgba(232,184,64,.14)}
.lvl{border:1px solid currentColor}
.lvl.l0{color:var(--muted)} .lvl.l1{color:#8fb6ff} .lvl.l2{color:#c5a6ff} .lvl.l3{color:var(--peacock)}
.vipb{background:var(--gold);color:#241a00}
.rel{color:var(--muted);background:rgba(163,161,203,.08)}
.rel.lowrel{color:var(--bad);background:rgba(255,99,130,.1)}

.pro{display:flex;flex-direction:column;gap:10px;text-decoration:none}
.pro:hover{border-color:#3d3d74}
.pro.isvip{border-color:rgba(232,184,64,.45)}
.pro-head{display:flex;gap:12px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;padding:3px 9px;border-radius:6px;background:var(--panel2);color:var(--muted)}

.sponsor{border-style:dashed;display:flex;flex-direction:column;gap:8px;justify-content:center;background:linear-gradient(160deg,rgba(232,184,64,.06),transparent 60%),var(--panel)}
.spon-tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}

.back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--text)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.facts div{background:var(--panel2);border-radius:10px;padding:10px 12px}
.facts dt{font-size:.78rem;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700}
.fair{border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:.92rem;border:1px solid var(--line)}
.fair.fair-ok{border-color:rgba(47,211,154,.4);background:rgba(47,211,154,.06)}
.fair.fair-low{border-color:rgba(255,182,72,.5);background:rgba(255,182,72,.07)}
.fair.fair-high{border-color:rgba(0,184,169,.4);background:rgba(0,184,169,.06)}
.desc{white-space:pre-wrap;max-width:65ch;color:#d9d7f5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.box{margin-top:16px;padding:14px;border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.applicant{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.applicant:first-of-type{border-top:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.quote{color:#d9d7f5;font-size:.94rem}

.prof-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.statrow div{background:var(--panel2);border-radius:10px;padding:12px}
.statrow dt{font-size:.78rem;color:var(--muted)}
.statrow dd{margin:2px 0 0;font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--peacock),var(--blue),var(--violet));border-radius:99px}
.review{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.review:first-of-type{border-top:0}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:30px 0 12px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.fine{font-size:.85rem;color:var(--muted)}

.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vid{background:var(--panel2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vid video{width:100%;aspect-ratio:9/12;max-height:360px;background:#000;display:block;object-fit:cover}
.vid .cap{padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.88rem}
.vlink{display:flex;align-items:center;gap:12px;padding:16px;text-decoration:none;background:var(--panel2);border-radius:12px}
.vlink .play{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--blue));flex:none}

/* Calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.75rem;color:var(--muted);text-align:center;padding:4px 0;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.day{min-height:104px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.blank{background:transparent;border-color:transparent}
.day.today{border-color:var(--peacock)}
.day.past{opacity:.55}
.day .dn{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.ev{display:block;font-size:.74rem;line-height:1.25;padding:3px 6px;border-radius:6px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(47,123,255,.2);color:#cfe0ff}
.ev.t-open-mic{background:rgba(139,77,255,.22);color:#e0d0ff}
.ev.t-showcase{background:rgba(0,184,169,.2);color:#bff5ef}
.ev.t-audition{background:rgba(255,99,130,.18);color:#ffd0da}
.ev.t-jam-session{background:rgba(232,184,64,.2);color:#fbe7b4}
.ev:hover{filter:brightness(1.25)}
.more{font-size:.72rem;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:10px 0 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.agenda .applicant{padding:10px 0}
.datebox{width:52px;flex:none;text-align:center;border-radius:10px;background:var(--panel2);padding:6px 0}
.datebox b{display:block;font-family:var(--display);font-size:1.1rem}
.datebox span{font-size:.7rem;color:var(--muted);text-transform:uppercase}

form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f .full{grid-column:1/-1}
.f label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);font-weight:500}
.f label.check{flex-direction:row;align-items:center;gap:8px}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:1rem}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--peacock);outline:none}
.f textarea{min-height:110px;resize:vertical}
.f .btns{display:flex;gap:10px;justify-content:flex-end}
.hint{font-size:.85rem;color:var(--muted);min-height:1.2em}
.hint.low{color:var(--warn)} .hint.ok{color:var(--good)}
.starpick{display:flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}
.starpick input{position:absolute;opacity:0;pointer-events:none}
.starpick label{font-size:2rem;color:#3a3a66;cursor:pointer;line-height:1}
.starpick input:checked ~ label,.starpick label:hover,.starpick label:hover ~ label{color:var(--gold)}
.starpick input:focus-visible + label{outline:2px solid var(--peacock);border-radius:4px}

.roadmap{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.roadmap div{border:1px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-size:.9rem}
.roadmap b{display:block;color:var(--text);font-size:.95rem;margin-bottom:2px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(3,3,14,.72);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.sheet h2{margin-bottom:6px}
.sheet .sub{color:var(--muted);margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.skel{height:170px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:820px){
  .split{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .statrow{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .day{min-height:54px;padding:4px}
  .ev{font-size:0;padding:0;height:6px;border-radius:3px}
  .more{display:none}
}
@media (max-width:560px){
  .brand img{height:38px}
  .top .wrap{gap:10px}
  .me-btn .lbl{display:none}
  form.f{grid-template-columns:1fr}
  .stats{flex-wrap:wrap}
  .wrap{padding:0 16px}
  .cal{gap:3px}
}

.brand img{display:block;mix-blend-mode:screen}
nav.tabs a{display:flex;align-items:center;gap:6px}
nav.tabs .ti{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero-logo{display:block;width:min(560px,100%);height:auto;mix-blend-mode:screen;margin:0 0 6px -10px}
@media (max-width:640px){
  header.top{backdrop-filter:none;background:#07071a}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,7,26,.97);border-top:1px solid var(--line);justify-content:space-around;gap:0;padding:6px 4px calc(8px + env(safe-area-inset-bottom));overflow:visible}
  nav.tabs a{flex:1;flex-direction:column;gap:3px;font-size:.72rem;padding:6px 2px;border-radius:12px}
  nav.tabs a.on{background:var(--panel2)}
  nav.tabs .ti{width:22px;height:22px}
  .top .wrap{justify-content:space-between}
  main{padding-bottom:110px}
  .toast{bottom:96px}
}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel)}
.choice:has(input:checked){border-color:var(--peacock)}
.choice input{margin-top:4px}
.warnbox{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,182,72,.5);background:rgba(255,182,72,.08);font-size:.9rem}
.warnbox[hidden]{display:none}
.testbanner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;margin-bottom:16px;border-radius:12px;background:repeating-linear-gradient(45deg,rgba(232,184,64,.16) 0 12px,rgba(232,184,64,.08) 12px 24px);border:1px solid var(--gold)}
.testbanner b{color:var(--gold)}

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function strip(o){const c={...o};delete c.id;return c;}
function now(){return new Date().toISOString();}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

function daysSince(date){return (Date.now()-new Date(date+'T23:59:00').getTime())/86400000;}
function newId(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function deepMerge(a,b){const o={...(a||{})};for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))o[k]=deepMerge(o[k],v);else o[k]=v;}return o;}
function rolesOf(p){p=p||{};return Array.isArray(p.roles)&&p.roles.length?p.roles.filter(r=>ROLES.includes(r)):(p.role?[p.role]:[]);}
function rateFor(p,r){p=p||{};if(p.rates&&typeof p.rates==='object'&&p.rates[r])return String(p.rates[r]);return rolesOf(p)[0]===r?(p.rate||''):'';}

const RATE_PH={'Vocalist':'$200 per set','Musician':'$175 per gig','Music Director':'$350 per event','Band':'$1,500 per event','Sound engineer':'$45 per hour','DJ':'$400 per event','Host / MC':'$150 per event'};
function rateRows(roles,vals){

function miles(a,b){const R=3958.8,t=x=>x*Math.PI/180;const dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function geoOk(city,state,near,radius){

}

/* Escrow timing: once the performer marks the gig done, the booker has 48 business hours
   (weekdays only) to confirm or report a problem. If they don't, it completes on its own. */
function addBusinessHours(iso,hours){
  let d=new Date(iso);if(isNaN(d))return null;let left=hours*3600e3;
  while(left>0){
    const day=d.getDay();
    if(day===0||day===6){d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+(day===6?2:1));continue;}
    const eod=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    const chunk=Math.min(left,eod-d);d=new Date(d.getTime()+chunk);left-=chunk;
  }
  return d;
}
function confirmDeadline(g){const t=g.confirms&&g.confirms[g.bookedId];return t?addBusinessHours(t,48):null;}
function openDispute(g){return !!(g.dispute&&!g.dispute.resolved);}
function autoConfirmed(g){const dl=confirmDeadline(g);return !!dl&&!(g.confirms&&g.confirms[g.posterId])&&!g.dispute&&Date.now()>=dl.getTime();}
function isCompleted(g){
  if(g.status!=='booked'||!g.confirms||!g.confirms[g.bookedId])return false;
  if(g.dispute){return g.dispute.resolved==='release'||g.dispute.resolved==='split';}
  return !!g.confirms[g.posterId]||autoConfirmed(g);
}
function holdState(g){
  const h=g.hold;if(!h)return null;
  if(h.status==='returned')return 'returned';
  if(g.dispute){if(!g.dispute.resolved)return 'disputed';return g.dispute.resolved==='refund'?'refunded':'released';}
  return isCompleted(g)?'released':'held';
}
function fmtT(t){if(!t)return '';const m=/^(\d{1,2}):(\d{2})/.exec(t);if(!m)return esc(t);let h=+m[1];const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m[2]} ${ap}`;}
function gigStart(g){if(!g.date)return null;const d=new Date(g.date+'T'+(g.time||'12:00'));return isNaN(d)?null:d;}
function hoursUntil(g){const d=gigStart(g);return d?(d.getTime()-Date.now())/3.6e6:Infinity;}
function cancelInfo(g){
  const hrs=hoursUntil(g);const booked=g.bookedAt?new Date(g.bookedAt).getTime():0;const st=gigStart(g);
  const shortNotice=booked&&st&&(st.getTime()-booked)<72*3.6e6;
  const grace=shortNotice&&(Date.now()-booked)<2*3.6e6;
  const late=hrs<72&&!grace;
  const dayOf=g.date===todayStr();
  return {late,grace,dayOf,hrs};
}
function gTerms(g){return g.terms&&typeof g.terms==='object'?g.terms:{};}
function termsList(g){
  const t=gTerms(g),out=[];
  if(Number(t.lateFeePct))out.push(`Late arrival: ${Number(t.lateFeePct)}% off the pay for every 15 minutes late`);
  if(t.arriveBy)out.push(`Must arrive by ${fmtT(t.arriveBy)}`);
  if(t.dressCode&&g.attire)out.push(`Dress code required: ${esc(g.attire)}`);
  if(t.sober)out.push('No smoking or drinking before or during the gig');
  if(Number(t.cancelFeePct))out.push(`If the booker cancels within 72 hours, the performer receives ${Number(t.cancelFeePct)}% of the pay`);
  return out;
}
function lateCancels(id){
  let late=0,emerg=0;
  gigsArr().forEach(g=>(g.cancellations||[]).forEach(c=>{if(c.by!==id)return;if(c.emergency)emerg++;else if(c.late)late++;}));
  return late+Math.max(0,emerg-1);
}
function deductionOf(g){return g.deduction&&Number(g.deduction.amount)?g.deduction:null;}
function releaseAmount(g){
  const h=g.hold;if(!h)return 0;const amt=Number(h.amount)||0;
  if(g.dispute&&g.dispute.resolved==='split')return Math.round(amt*(Number(g.dispute.pct)||0)/100);
  if(g.dispute&&g.dispute.resolved==='release')return amt;
  const d=deductionOf(g);return Math.max(0,amt-(d?Number(d.amount):0));
}
const REVIEW_Q={
  performer:[['onTime','Were they on time?'],['prepared','Did they show up ready and prepared?'],['professional','Were they professional?'],['dress','Did they follow the dress code?'],['asAgreed','Did they do the gig as agreed?']],

};
function trackRecord(id){

  [...REVIEW_Q.performer,...REVIEW_Q.booker].forEach(([k,q])=>{const xs=rs.filter(r=>typeof r.answers[k]==='boolean');if(xs.length)out.push([q.replace(/^(Were they|Did they|Were the|Were you) /,'').replace('?',''),xs.filter(r=>r.answers[k]).length,xs.length,k]);});
  return out;
}
function fmtWhen(d){return d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function reliability(id){
  const due=gigsArr().filter(g=>g.status==='booked'&&(g.posterId===id||g.bookedId===id)&&g.date&&daysSince(g.date)>=7);
  const lc=lateCancels(id);

  return Math.round(100*due.filter(g=>g.confirms&&g.confirms[id]).length/(due.length+lc));
}

/* ---------- data writes ---------- */
async function save(coll,id,data){
  if(TEST.on&&S.isOwner&&!S.data[coll][id])data={...data,test:true};
  if(S.mode==='live'){
    const {error}=await SB.from(coll).upsert({id,data});
    if(error){writeError(error);return false;}
  }
  S.data[coll]={...S.data[coll],[id]:{...data,id}};return true;
}
async function patch(coll,id,data){
  const merged=deepMerge(strip(S.data[coll][id]||{}),data);
  if(S.mode==='live'){
    const {data:rows,error}=await SB.from(coll).update({data:merged}).eq('id',id).select('id');
    if(error||!rows||!rows.length){writeError(error||{code:'42501'});return false;}
  }
  S.data[coll]={...S.data[coll],[id]:{...merged,id}};return true;
}
async function remove(coll,id){
  if(S.mode==='live'){const {error}=await SB.from(coll).delete().eq('id',id);if(error){writeError(error);return false;}}
  const c={...S.data[coll]};delete c[id];S.data[coll]=c;return true;
}
function writeError(e){
  console.warn('Plug’d write failed',e);
  if(e&&e.code==='42501')toast("You don't have permission to change that.");
  else toast("That didn't save. Check your connection and try again.");
}
function canAct(){
  if(!S.me){if(S.mode==='live')openAuth('signup');return false;}
  return true;
}
function needProfile(next){
  if(!canAct())return false;

}

function b64u(str){const pad='='.repeat((4-str.length%4)%4);const b=atob((str+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)));}

function afterGigBox(g){
  const party=S.me&&(S.me===g.posterId||S.me===g.bookedId);
  const isPoster=S.me===g.posterId,isBooked=S.me===g.bookedId;
  const other=isPoster?g.bookedId:g.posterId;
  const cf=g.confirms||{};const dl=confirmDeadline(g);
  let h='<div class="box">';
  if(isCompleted(g)){
    h+=`<div class="row"><span class="pill completed">Completed</span><span class="muted">${g.dispute?'Plug’d resolved the issue and completed this gig.':(autoConfirmed(g)?`${esc(nameOf(g.bookedId))} marked it done and ${esc(nameOf(g.posterId))} didn't respond within 48 business hours, so it completed automatically.`:'Both sides confirmed this gig happened.')}</span></div>`;
  }else if(openDispute(g)){
    h+=`<div class="row"><span class="pill pending">Under review</span><span class="muted">${esc(nameOf(g.dispute.by))} reported a problem. The money stays held until Plug’d sorts it out.</span></div>`+
       (g.dispute.reason?`<p class="quote">“${esc(g.dispute.reason)}”</p>`:'')+
       (S.isOwner?`<div class="row"><span class="fine">Admin:</span><button class="btn teal sm" data-act="resolve" data-v="release" data-id="${esc(g.id)}">${g.hold?'Release to '+esc(nameOf(g.bookedId)):'Close as completed'}</button><button class="btn ghost sm" data-act="resolve" data-v="refund" data-id="${esc(g.id)}">${g.hold?'Refund '+esc(nameOf(g.posterId)):'Close: gig fell through'}</button>${g.hold?`<span class="row" style="gap:6px"><input id="split-pct-${esc(g.id)}" type="number" min="1" max="99" value="75" class="mini" aria-label="Percent to the performer"><span class="fine">% to performer</span><button class="btn ghost sm" data-act="resolve" data-v="split" data-id="${esc(g.id)}">Split</button></span>`:''}</div>`:'');
  }else if(g.dispute&&g.dispute.resolved==='refund'){
    h+=`<div class="row"><span class="pill declined">Refunded</span><span class="muted">Plug’d reviewed the problem report and refunded ${esc(nameOf(g.posterId))}.</span></div>`;
  }else if(!isPast(g)){
    h+=`<span class="muted">After the gig, ${esc(nameOf(g.bookedId))} marks it done. ${esc(nameOf(g.posterId))} then has 48 business hours to confirm or report a problem.</span>`;
    if(party){const ci=cancelInfo(g);h+=`<div class="row"><button class="btn ghost sm" data-act="cancelbooking" data-id="${esc(g.id)}">${isBooked&&ci.dayOf?'Emergency cancel':'Cancel booking'}</button><span class="fine">${ci.grace?'Free to cancel for 2 hours after a last-minute booking.':ci.late?'Inside 72 hours: cancelling now counts against reliability.':'Free to cancel until 72 hours before the gig.'}</span></div>`;}
  }else if(!cf[g.bookedId]){
    h+=isBooked?`<div class="row"><span>Did you play this gig?</span><button class="btn teal sm" data-act="confirm" data-id="${esc(g.id)}">Mark gig completed</button></div><span class="fine">${esc(nameOf(g.posterId))} then has 48 business hours to confirm or report a problem. If they don't respond, it completes automatically${g.hold?' and your money is released':''}.</span>`
      :`<span class="muted">Waiting for ${esc(nameOf(g.bookedId))} to mark the gig completed.</span>`;
  }else{
    const when=dl?fmtWhen(dl):'';
    if(isPoster)h+=`<div class="row"><span>${esc(nameOf(g.bookedId))} marked this gig completed.</span><button class="btn teal sm" data-act="confirm" data-id="${esc(g.id)}">Confirm it happened</button><button class="btn ghost sm" data-act="dispute" data-id="${esc(g.id)}">Report a problem</button></div><span class="fine">You have until <b>${esc(when)}</b> (48 business hours). If you don't respond, it completes automatically${g.hold?' and the held money is released':''}.</span>`;
    else h+=`<span class="muted">${isBooked?'You marked it completed.':esc(nameOf(g.bookedId))+' marked it completed.'} ${esc(nameOf(g.posterId))} has until ${esc(when)} to confirm or report a problem. After that it completes automatically${g.hold?' and the money is released':''}.</span>`;
  }
  if(party){
    const oc=contactOf(other);
    h+=`<div class="row"><span>🔓 <b>${esc(nameOf(other))}'s contact:</b> ${oc?esc(oc):'<span class="muted">not added yet</span>'}</span></div>`;
    if(g.payPlan==='outside'&&!g.hold)h+=`<span class="fine">Paid directly, so Plug’d Pay doesn't protect this payment.</span>`;
  }
  if(TEST.on&&S.isOwner)h+=testTools(g);
  if(party){
    const p=g.payment,hd=g.hold,hs=holdState(g);
    if(hs==='held'){
      h+=`<div class="row"><span>💳 <b>${money(hd.amount)}</b> is held by Plug’d Pay until the gig is completed.</span>${isPoster&&!cf[g.bookedId]?`<button class="btn ghost sm" data-act="cashinstead" data-id="${esc(g.id)}">Paid in cash instead</button>`:''}</div>`;
    }else if(hs==='disputed'){
      h+=`<div class="row"><span>💳 <b>${money(hd.amount)}</b> stays held while Plug’d reviews the problem.</span></div>`;
    }else if(hs==='released'){
      const rel=releaseAmount(g),ded=deductionOf(g);
      h+=`<div class="row"><span class="pill accepted">Paid</span><span>✅ ${money(rel)} released to ${esc(nameOf(g.bookedId))}${hd.fee?` (${cents(rel-payFee(rel))} after card fees)`:''}${g.dispute&&g.dispute.resolved==='split'?` · Plug’d split it ${Number(g.dispute.pct)}% to the performer`:''}${!g.dispute&&ded?` · late fee: ${ded.minutes} min late, ${ded.pct}% (${money(ded.amount)}) returned to ${esc(nameOf(g.posterId))}`:''}.</span></div>`;
      if(isBooked&&ded&&!g.dispute&&g.confirms&&g.confirms[g.posterId]&&Date.now()<addBusinessHours(g.confirms[g.posterId],48).getTime())h+=`<div class="row"><span class="fine">Disagree with the late fee?</span><button class="btn ghost sm" data-act="pdispute" data-id="${esc(g.id)}">Report a problem</button></div>`;
    }else if(hs==='refunded'){
      h+=`<div class="row"><span class="muted">↩ ${money(hd.amount)} refunded to ${esc(nameOf(g.posterId))}'s card.</span></div>`;
    }else if(hs==='returned'){
      h+=`<div class="row"><span class="muted">↩ The ${money(hd.amount)} hold went back to ${esc(nameOf(g.posterId))}'s card because they paid another way.</span></div>`;
    }
    if(hd&&hs!=='returned'){/* Plug'd Pay handles it */}
    else if(p){
      h+=`<div class="row"><span>💵 ${money(p.amount)} paid by ${esc(p.method||'other')}${p.paidAt?' on '+esc(new Date(p.paidAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})):''}.</span>`+
        (p.receivedAt?`<span class="pill accepted">Received</span>`:(isBooked?`<button class="btn teal sm" data-act="received" data-id="${esc(g.id)}">I received it</button>`:`<span class="muted">Waiting for ${esc(nameOf(g.bookedId))} to confirm.</span>`))+`</div>`;
    }else if(isPoster&&isPast(g)){
      h+=`<div class="row"><span class="muted">Paid outside the app?</span><button class="btn ghost sm" data-act="paid" data-id="${esc(g.id)}">Record payment</button></div>`;
    }
    if(isBooked&&isPast(g)&&!g.hold&&!(g.payment&&g.payment.receivedAt)&&!g.dispute)h+=`<div class="row"><span class="fine">Haven't been paid?</span><button class="btn ghost sm" data-act="pdispute" data-id="${esc(g.id)}">Report a problem</button></div>`;
    if(isCompleted(g)){
      h+=S.data.reviews[g.id+'__'+S.me]?`<span class="muted">You reviewed ${esc(nameOf(other))}.</span>`:`<div><button class="btn sm" data-act="review" data-id="${esc(g.id)}">Review ${esc(nameOf(other))}</button></div>`;
    }
  }else if(S.isOwner&&openDispute(g)===false&&false){}
  return h+'</div>';
}
function testTools(g){
  let t='';
  if(g.status==='booked'&&!isPast(g))t+=`<button class="btn ghost sm" data-act="t-past" data-id="${esc(g.id)}">⏩ Move gig to yesterday</button>`;
  const c=g.confirms||{};
  if(g.status==='booked'&&c[g.bookedId]&&!c[g.posterId]&&!g.dispute&&!isCompleted(g))t+=`<button class="btn ghost sm" data-act="t-skip" data-id="${esc(g.id)}">⏩ Skip ahead 48 business hours</button>`;
  return t?`<div class="row testbar"><span class="fine">Test tools:</span>${t}</div>`:'';
}
function offerBox(g){
  const amt=Number(g.offer.amount)||0,fee=payFee(amt);
  return `<div class="box" style="margin-top:0;width:100%"><b>${esc(nameOf(g.posterId))} wants to book you for ${money(amt)}.</b>
  ${amt?`<span class="muted">How do you want to be paid?</span>
  <label class="choice"><input type="radio" name="pp" value="hold" checked><span><b>Protect this payment with Plug’d Pay</b><br><span class="fine">${esc(nameOf(g.posterId))}'s card is held before the gig and the money is released to you after it's confirmed. You receive <b>${cents(amt-fee)}</b> (card fee about ${cents(fee)}). <a href="#rules">Plug’d Pay rules and guidelines</a></span></span></label>
  <label class="choice"><input type="radio" name="pp" value="outside"><span><b>Get paid in cash</b> <span class="pill accepted">Full payment, no fees</span><br><span class="fine">${esc(nameOf(g.posterId))} pays you ${money(amt)} directly: cash, Cash App, Zelle and so on.</span></span></label>
  <label class="check warnbox" id="cash-ack" hidden><input type="checkbox" id="ack"><span>I understand Plug’d Pay won't protect this payment. If the money doesn't reach me, Plug’d can't help recover it.</span></label>`:`<span class="muted">This one has no pay attached.</span>`}
  ${termsList(g).length?`<div class="termsbox"><b>Gig terms you're agreeing to</b><ul>${termsList(g).map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}
  ${g.attire||g.loadIn||g.setlist?`<span class="fine">${g.loadIn?'Load-in '+fmtT(g.loadIn)+'. ':''}${g.attire?'Attire: '+esc(g.attire)+'. ':''}${g.setlist?'Setlist is listed above.':''}</span>`:''}
  <span class="fine">By accepting, you agree to the gig details and terms above.</span>
  <div class="row"><button class="btn teal" data-act="acceptoffer" data-id="${esc(g.id)}">Accept booking</button><button class="btn ghost" data-act="declineoffer" data-id="${esc(g.id)}">Decline</button></div></div>`;
}
function applicantsPanel(g,apps){
  if(!apps.length)return `<div class="card"><h2>Sign-ups</h2><p class="muted" style="margin-top:8px">No one has signed up yet. Share the link to get it seen.</p></div>`;
  return `<div class="card"><h2>Sign-ups (${apps.length})</h2>${apps.map(a=>`
    <div class="applicant">
      <div class="row between"><a class="poster" href="#profile-${esc(a.applicantId)}">${avatar(a.applicantId)}<b class="nm">${esc(nameOf(a.applicantId))}</b></a><span class="pill ${esc(a.status)}">${esc(a.status)}</span></div>
      <div class="row">${vipHtml(a.applicantId)}${tierHtml(a.applicantId)}${relHtml(a.applicantId)}${ratingMini(a.applicantId)}</div>
      ${a.message?`<p class="quote">${esc(a.message)}</p>`:''}
      ${a.rate?`<p class="fine">Their price: <b>${esc(a.rate)}</b></p>`:''}
      ${a.status==='offered'&&g.offer&&g.offer.appId===a.id?`<div class="row"><span class="fine">Offer sent for ${money(g.offer.amount)}${g.offer.plan==='hold'?' with Plug’d Pay':''}. Waiting for them to accept.</span><button class="btn ghost sm" data-act="withdrawoffer" data-id="${esc(g.id)}">Withdraw offer</button></div>`:''}${g.status==='open'&&a.status==='pending'&&!g.offer?`<div class="row"><button class="btn teal sm" data-act="accept" data-id="${esc(a.id)}">Offer booking</button><button class="btn ghost sm" data-act="decline" data-id="${esc(a.id)}">Decline</button></div>`:''}
    </div>`).join('')}</div>`;

function reviewTarget(g){
  if(!S.me||!isCompleted(g))return null;
  if(g.posterId===S.me)return g.bookedId;
  if(g.bookedId===S.me)return g.posterId;
  return null;
}

/* calendar */
function calendarView(){
  if(C.y===null){const d=new Date();C.y=d.getFullYear();C.m=d.getMonth();}
  const first=new Date(C.y,C.m,1),dow=first.getDay(),days=new Date(C.y,C.m+1,0).getDate();
  const ym=`${C.y}-${pad(C.m+1)}`;const tdy=todayStr();
  const gs=gigsArr().filter(g=>g.date&&g.date.startsWith(ym)&&g.status!=='closed'&&(C.type==='All'||evType(g)===C.type)&&geoOk(g.city,C.state,'',0))
    .sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const byDay={};gs.forEach(g=>{const d=+g.date.slice(8);(byDay[d]=byDay[d]||[]).push(g);});
  let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<dow;i++)cells+='<div class="day blank" aria-hidden="true"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${ym}-${pad(d)}`;const list=byDay[d]||[];
    cells+=`<div class="day ${ds===tdy?'today':''} ${ds<tdy?'past':''}"><span class="dn">${d}</span>${list.slice(0,3).map(g=>`<a class="ev t-${slug(evType(g))}" href="#gig-${esc(g.id)}" title="${esc(g.title)} · ${esc(g.city)}">${esc(g.title)}</a>`).join('')}${list.length>3?`<span class="more">+${list.length-3} more</span>`:''}</div>`;
  }
  const label=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  return `<section class="hero"><div><p class="eyebrow">Event calendar</p><h1>What's happening</h1><p class="lede">Every gig, open mic, showcase, audition and jam session on one calendar. Tap an event to sign up and perform.</p></div></section>
  <div class="filters">${stateChips(C.state,'cstate')}
    <label class="sel">Type <select id="c-type">${['All',...EVENT_TYPES].map(r=>`<option ${C.type===r?'selected':''}>${esc(r)}</option>`).join('')}</select></label>
  </div>
  <div class="card">
    <div class="cal-head"><h2>${esc(label)}</h2><div class="row"><button class="btn ghost sm" data-act="calprev" aria-label="Previous month">←</button><button class="btn ghost sm" data-act="caltoday">Today</button><button class="btn ghost sm" data-act="calnext" aria-label="Next month">→</button></div></div>
    <div class="cal">${cells}</div>
    <div class="legend">${EVENT_TYPES.map(t=>`<span><i class="ev t-${slug(t)}" style="padding:0;width:10px;height:10px"></i>${esc(t)}</span>`).join('')}</div>
  </div>
  <div class="section-title"><h2>${gs.length} ${gs.length===1?'event':'events'} in ${esc(first.toLocaleDateString('en-US',{month:'long'}))}</h2></div>
  ${gs.length?`<section class="card agenda">${gs.map(g=>{const d=new Date(g.date+'T12:00');const st=gigStatus(g);return `<div class="applicant"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:12px"><div class="datebox"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-US',{weekday:'short'})}</span></div><div><a href="#gig-${esc(g.id)}"><b>${esc(g.title)}</b></a><br><span class="fine">${esc(evType(g))} · ${esc(g.city)} · ${payHtml(g)}</span></div></div><span class="pill ${st[1]}">${st[0]}</span></div></div>`;}).join('')}</section>`:`<div class="empty">Nothing on the calendar this month${C.state!=='All'?' in '+STATES[C.state]:''}. <a href="#post">Post an event</a>.</div>`}`;
}

function talentList(){
  const q=T.q.toLowerCase();
  let ids=Object.keys(S.data.profiles).filter(id=>{
    const p=S.data.profiles[id];
    if(isRemoved(id)&&!S.isOwner)return false;
    if(T.role!=='All'&&!rolesOf(p).includes(T.role))return false;
    if(!geoOk(p.city,T.state,T.near,T.radius))return false;
    if(q){const hay=[p.stageName,p.city,rolesOf(p).join(' '),(p.skills||[]).join(' ')].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  ids.sort((a,b)=>visibility(b)-visibility(a));
  if(S.loading&&!ids.length)return '<div class="skel"></div>'.repeat(3);
  if(!ids.length)return `<div class="empty" style="grid-column:1/-1">No one matches that search yet.</div>`;
  const cards=ids.map(id=>{const p=S.data.profiles[id];return `<a class="card pro ${p.vip?'isvip':''}" href="#profile-${esc(id)}">
    <div class="pro-head">${avatar(id,'lg')}<div><h3>${esc(p.stageName)}</h3><p class="meta">${esc(rolesOf(p).join(' · '))}${p.city?' · '+esc(p.city):''}</p></div></div>
    <div class="row">${vipHtml(id)}${lvlHtml(id)}${tierHtml(id)}${relHtml(id)}</div>
    <div class="row">${ratingMini(id)}${(p.videos||[]).length?`<span class="fine">▶ ${(p.videos||[]).length} video${(p.videos||[]).length>1?'s':''}</span>`:''}</div>
    ${(p.skills||[]).length?`<div class="tags">${(p.skills||[]).slice(0,4).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>`:''}
    ${priceEntries(p).length?`<p class="fine">${priceEntries(p).map(([r,v])=>`${esc(r)}: <b>${esc(v)}</b>`).join(' · ')}</p>`:''}
  </a>`;});
  cards.splice(Math.min(6,cards.length),0,sponsorCard());
  return cards.join('');
}

function videoSrc(v){return v.localUrl||v.url||'';}
function videosHtml(p){
  const vs=(p.videos||[]).filter(v=>v&&(v.kind==='file'?(v.url||v.localUrl):safeLink(v.url)));
  if(!vs.length)return '';
  return `<div class="vids">${vs.map(v=>v.kind==='file'
    ?`<div class="vid"><video controls preload="metadata" playsinline src="${esc(videoSrc(v))}"></video>${v.caption?`<div class="cap">${esc(v.caption)}</div>`:''}</div>`
    :`<a class="vlink" href="${esc(safeLink(v.url))}" target="_blank" rel="noopener"><span class="play" aria-hidden="true">▶</span><span><b>${esc(v.caption||'Watch video')}</b><br><span class="fine">${esc(safeLink(v.url).replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</span></span></a>`).join('')}</div>`;
}

function updatePayHint(){
  const el=$('#pay-hint');if(!el)return;
  const g={role:$('#g-role').value,payType:$('#g-paytype').value,pay:Number($('#g-pay').value)||0,eventType:$('#g-type').value,occasion:($('#g-occasion')||{}).value};
  const r=rangeFor(g.role,g.payType,g.occasion);
  if(g.eventType==='Paid gig'&&!g.pay){el.className='hint full';el.textContent=r?`Typical pay for ${rangeWho(g.role,g.occasion)}: ${rangeText(r,g.payType)} (Plug’d estimate for NC, SC and VA).`:'';return;}
  if(!g.pay){el.className='hint full';el.textContent='Unpaid events are fine for open mics and jams. They\'ll be labeled clearly.';return;}
  const c=payCheck(g);if(!c){el.textContent='';return;}
  if(c[0]==='low'){el.className='hint full low';el.textContent=`That's below the typical ${rangeText(c[1],g.payType)} for ${rangeWho(g.role,g.occasion)}. You can still post, but consider raising it or marking it negotiable.`;}
  else{el.className='hint full ok';el.textContent=`Fair: typical pay for ${rangeWho(g.role,g.occasion)} is ${rangeText(c[1],g.payType)}.`;}
}

async function addReport(data){
  const id=newId('r');
  if(typeof SB!=='undefined'&&SB){const {error}=await SB.from('reports').insert({id,data});if(error){writeError(error);return false;}}
  else if(S.mode==='live'&&typeof DB!=='undefined'&&DB){try{await DB.collection('reports').doc(id).set(data);}catch(e){writeError(e);return false;}}
  S.reports={...(S.reports||{}),[id]:{...data,id}};return true;
}
async function loadReports(){
  try{
    if(typeof SB!=='undefined'&&SB){const {data,error}=await SB.from('reports').select('id,data');if(!error){const o={};(data||[]).forEach(r=>{o[r.id]={...(r.data||{}),id:r.id};});S.reports=o;}}
    else if(S.mode==='live'&&typeof DB!=='undefined'&&DB){const snap=await DB.collection('reports').get();const o={};snap.docs.forEach(d=>{o[d.id]={...d.data(),id:d.id};});S.reports=o;}
  }catch(e){}
  softRender();
}

    <p>After the gig, the performer marks it completed. The booker then has <b>48 business hours</b> (weekdays only) to confirm it or report a problem. If they don't respond, the gig completes and the held money is released to the performer automatically. If a problem is reported, the money stays held while Plug’d reviews it with both sides, then it's released or refunded.</p>
    <h2>Gig terms and cancellations</h2><p>Bookers can add gig terms when posting: a late fee (a % off per 15 minutes late), an arrive-by time, a dress code, no smoking or drinking, and a cancellation fee. Performers see the terms before accepting, and accepting means agreeing to them. Anything not in the terms can't be taken out of the pay, but it can be part of an honest review.</p>
    <p>Either side can cancel a booking. More than 72 hours before the gig, there's no penalty. Inside 72 hours, a cancellation counts against reliability, and if the booker cancels late, the performer receives the cancellation fee from the gig terms. Gigs booked less than 72 hours out can be cancelled free for 2 hours after booking. A real day-of emergency doesn't count against a performer the first time, and the gig reopens so the booker can find a replacement.</p>
    <h2>Community feed</h2><p>When the feed is on, keep posts friendly and about music: shout-outs, questions, gear, who's playing where. No contact info, no booking or paying outside Plug’d, no harassment. Tap <b>Report</b> on a post to flag it, and Plug’d may remove posts or add strikes.</p>
    <h2>Stay safe</h2><p>Never pay anyone or share card details outside Plug’d to get a gig. Real bookers on Plug’d never ask performers to pay. If someone asks you to book or pay outside the app, seems fake, or harasses you, tap <b>Report</b> on their profile.</p>
    <h2>5. Strikes</h2><p>Going around the app, no-shows, fake reviews or harassment can earn a strike. Each strike lowers you in search. Three strikes and your profile is removed.</p>
    <h2>6. Honest reviews</h2><p>Reviews open only after a gig is confirmed. Each review asks simple yes-or-no questions (on time, prepared, professional, dressed to code, did the gig as agreed; or for bookers: paid as agreed, accurate details, respectful), then a star rating and comment. Review the work, not the friendship, and keep it honest.</p>
    <p class="fine" style="margin-top:18px">Plug’d Pay is in preview: no real cards are charged yet.</p>
  </section>`;
}

      dressCode:chk('t-dress')&&!!data.attire,sober:chk('t-sober'),cancelFeePct:chk('t-cancel')?Math.min(100,Math.max(1,Math.round(Number(v('t-cancel-pct'))||50))):0};
    if(chk('t-dress')&&!data.attire){toast('Add the attire / dress code, or uncheck that term.');done();return;}
    if(chk('t-arrive')&&!data.terms.arriveBy){toast('Add the arrive-by time, or uncheck that term.');done();return;}
    if(hasContact(data.setlist)||hasContact(data.attire)||hasContact(data.rehearsal&&data.rehearsal.place)){toast(CONTACT_MSG);done();return;}
    if(!(await save('gigs',id,data))){done();return;}
    toast('Posted. It\'s on the calendar.');location.hash='gig-'+id;return;
  }
  if(kind==='apply'){
    if(hasContact(v('a-msg'))||hasContact(v('a-rate'))){toast(CONTACT_MSG);done();return;}
    const gid=f.dataset.gig;const g=S.data.gigs[gid];if(!g){done();return;}
    const data={gigId:gid,applicantId:S.me,message:v('a-msg'),rate:v('a-rate'),status:'pending',createdAt:now()};
    if(!(await save('applications',gid+'__'+S.me,data))){done();return;}
    notify(g.posterId,`New sign-up: ${nameOf(S.me)}`,`${g.title} (${shortDate(g)})${data.rate?' · Their price: '+data.rate:''}`,gid,'signup');
    closeModal();toast('Sent to '+nameOf(g.posterId)+'.');render();return;
  }
  if(kind==='review'){
    if(hasContact(v('r-text'))){toast(CONTACT_MSG);done();return;}
    const gid=f.dataset.gig,about=f.dataset.about;
    const st=f.querySelector('input[name=stars]:checked');
    if(!st){toast('Pick a star rating.');done();return;}
    const answers={};f.querySelectorAll('fieldset.yn input:checked').forEach(i=>{answers[i.name.slice(2)]=i.value==='yes';});
    const data={aboutId:about,authorId:S.me,gigId:gid,stars:Number(st.value),text:v('r-text'),answers,createdAt:now()};
    if(!(await save('reviews',gid+'__'+S.me,data))){done();return;}
    closeModal();toast('Review posted. Thanks for building trust on Plug’d.');render();return;
  }
  if(kind==='paid'){
    const gid=f.dataset.gig;const amt=Math.round(Number(v('pd-amt'))||0);
    if(amt<1){toast('Enter the amount you paid.');done();return;}
    const method=PAY_METHODS.includes(v('pd-method'))?v('pd-method'):'Other';
    const upd={payment:{amount:amt,method,paidAt:now()}};
    if(f.dataset.cash==='1')upd.hold={status:'returned',returnedAt:now()};
    if(!(await patch('gigs',gid,upd))){done();return;}
    closeModal();toast(f.dataset.cash==='1'?'Hold returned to your card and payment recorded.':'Payment recorded.');render();return;
  }
  if(kind==='post'){
    const text=v('fp-text');if(!text){done();return;}
    if(hasContact(text)){toast(CONTACT_MSG);done();return;}
    if(!(await xAdd('posts',newId('p'),{authorId:S.me,text:text.slice(0,500),createdAt:now()}))){done();return;}
    toast('Posted.');render();return;
  }
  if(kind==='comment'){
    const inp=f.querySelector('input');const text=(inp&&inp.value||'').trim();if(!text){done();return;}
    if(hasContact(text)){toast(CONTACT_MSG);done();return;}
    const pid=f.dataset.post;const pp=S.x.posts[pid];
    if(!(await xAdd('reactions',newId('c'),{postId:pid,by:S.me,kind:'comment',text:text.slice(0,300),createdAt:now()}))){done();return;}
    if(pp)notify(pp.authorId,`${nameOf(S.me)} commented on your post`,text.slice(0,140),'','comment');
    render();return;
  }
  if(kind==='cancel'){
    const gid=f.dataset.gig;const g=S.data.gigs[gid];if(!g||g.status!=='booked'||(S.me!==g.posterId&&S.me!==g.bookedId)){done();return;}
    const isBooked=S.me===g.bookedId;const ci=cancelInfo(g);const t=gTerms(g);const reason=v('c-reason');const emergency=isBooked&&/^Emergency/.test(reason);
    if(hasContact(v('c-note'))){toast(CONTACT_MSG);done();return;}
    const fee=!isBooked&&ci.late&&Number(t.cancelFeePct)&&g.hold?Math.round(Number(g.hold.amount)*Number(t.cancelFeePct)/100):0;
    const rec={by:S.me,at:now(),reason,note:v('c-note'),late:ci.late,emergency,fee,amount:g.hold?Number(g.hold.amount)||0:0,performer:g.bookedId};
    const appId=gid+'__'+g.bookedId;
    if(!(await patch('gigs',gid,{status:'open',bookedId:null,agreedPay:null,payPlan:null,hold:null,offer:null,confirms:null,deduction:null,cancellations:[...(g.cancellations||[]),rec]}))){done();return;}
    if(S.data.applications[appId])await patch('applications',appId,{status:'cancelled'});
    {const when=shortDate(g);
     if(isBooked)notify(g.posterId,`${nameOf(S.me)} cancelled`,`${g.title} (${when}) is open again${/^Event cancelled/.test(reason)?'':'. Everyone who applied has been told'}.${rec.emergency?' They marked it as an emergency.':''}`,gid,'cancel');
     else notify(rec.performer,`${nameOf(S.me)} cancelled your booking`,`${g.title} (${when}).${fee?` You'll receive a ${money(fee)} cancellation fee.`:''}`,gid,'cancel');
     if(!/^Event cancelled/.test(reason)){
       const others=Object.values(S.data.applications).filter(a=>a.gigId===gid&&a.applicantId!==rec.performer&&a.applicantId!==g.posterId&&a.status!=='withdrawn');
       others.forEach(a=>notify(a.applicantId,'A spot opened up',`${g.title} (${when}) is open again. Take another look if you're still available.`,gid,'reopen'));
     }}
    closeModal();toast(fee?`Booking cancelled. ${nameOf(rec.performer)} receives a ${money(fee)} cancellation fee.`:'Booking cancelled. The gig is open again.');render();return;
  }
  if(kind==='confirmlate'){
    const gid=f.dataset.gig;const g=S.data.gigs[gid];if(!g||g.posterId!==S.me){done();return;}
    const late=(f.querySelector('input[name=ontime]:checked')||{}).value==='no';const mins=Math.round(Number(v('cl-min'))||0);
    if(late&&mins<1){toast('Enter how many minutes late.');done();return;}
    const upd={confirms:{[S.me]:now()}};
    if(late){const pct=Math.min(100,Math.ceil(mins/15)*Number(gTerms(g).lateFeePct));upd.deduction={minutes:mins,pct,amount:Math.round(Number(g.hold.amount)*pct/100),at:now()};}
    if(!(await patch('gigs',gid,upd))){done();return;}
    closeModal();toast(late?`Confirmed with a ${upd.deduction.pct}% late fee. ${money(releaseAmount(S.data.gigs[gid]))} released to ${nameOf(g.bookedId)}.`:`Confirmed. ${money(g.hold.amount)} released to ${nameOf(g.bookedId)}.`);render();return;
  }
  if(kind==='report'){
    const about=f.dataset.about;
    if(!(await addReport({aboutId:about,reporterId:S.me,reason:v('rp-reason'),text:v('rp-text'),createdAt:now()}))){done();return;}
    closeModal();toast('Report sent to the Plug’d team. Thank you.');return;
  }
  if(kind==='pdispute'){
    const gid=f.dataset.gig;const g=S.data.gigs[gid];if(!g||g.bookedId!==S.me){done();return;}
    if(!(await patch('gigs',gid,{dispute:{by:S.me,reason:v('pd-reason'),at:now()}}))){done();return;}
    closeModal();toast('Problem reported. Plug’d will review it with both of you.');render();return;
  }
  if(kind==='dispute'){
    const gid=f.dataset.gig;const g=S.data.gigs[gid];
    if(!g||g.posterId!==S.me){done();return;}
    const dl=confirmDeadline(g);if(dl&&Date.now()>dl.getTime()){toast('The 48-business-hour window to report a problem has passed.');done();return;}
    if(!(await patch('gigs',gid,{dispute:{by:S.me,reason:v('d-reason'),at:now()}}))){done();return;}
    closeModal();toast('Problem reported. The money stays held while Plug’d reviews it.');render();return;
  }
  if(kind==='book'){
    const a=S.data.applications[f.dataset.app];const g=a&&S.data.gigs[a.gigId];
    if(!g||g.posterId!==S.me){done();return;}
    const amt=Math.max(0,Math.round(Number(v('b-amt'))||0));
    const mo=Number((profile(a.applicantId)||{}).minOffer)||0;
    if(mo&&amt<mo){toast(`${nameOf(a.applicantId)} only takes offers of ${money(mo)} or more.`);done();return;}
    if(!(await patch('applications',a.id,{status:'offered'}))){done();return;}
    if(!(await patch('gigs',g.id,{offer:{appId:a.id,applicantId:a.applicantId,amount:amt,at:now()}}))){done();return;}
    notify(a.applicantId,`Booking offer: ${money(amt)}`,`${nameOf(S.me)} wants to book you for ${g.title} (${shortDate(g)}). Open it to accept.`,g.id,'offer');
    closeModal();toast(`Booking offer sent to ${nameOf(a.applicantId)}. They'll accept it in the app.`);render();return;
  }
  done();
});

/* ---------- boot ---------- */
function startDemo(){
  S.mode='demo';S.loading=false;S.me='demo-you';S.realMe='demo-you';S.canWrite=true;S.isOwner=true;
  S.data=JSON.parse(JSON.stringify(DEMO));
  COLLS.forEach(c=>Object.keys(S.data[c]).forEach(k=>{S.data[c][k].id=k;}));
  S.note='Preview mode: this is sample data and your changes are not saved.';
  xLoadAll();
  render();
}
async function setUser(session){
  S.me=session&&session.user?session.user.id:null;S.realMe=S.me;S.email=session&&session.user?session.user.email:'';
  S.isOwner=false;S.canWrite=!!S.me;
  if(S.me){try{const {data}=await SB.from('admins').select('user_id').eq('user_id',S.me).maybeSingle();S.isOwner=!!data;}catch(e){}}
}
async function loadAll(quiet){
  try{
    const res=await Promise.all(COLLS.map(c=>SB.from(c).select('id,data').limit(10000)));
    res.forEach((r,i)=>{if(r.error)throw r.error;const o={};(r.data||[]).forEach(row=>{o[row.id]={...(row.data||{}),id:row.id};});S.data[COLLS[i]]=o;});
    if(S.me){const cr=await SB.from('contacts').select('user_id,contact');if(!cr.error){const m={};(cr.data||[]).forEach(r=>{m[r.user_id]=r.contact;});S.contacts=m;}}else S.contacts={};
    await xLoadAll();
    S.loading=false;if(S.note.indexOf("couldn't")>-1)S.note='';
  }catch(e){console.warn(e);S.loading=false;S.note="Plug’d couldn't load right now. Check your connection and try again.";}
  quiet?softRender():render();
}
async function boot(){
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  render();
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||!window.supabase||/YOUR_/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)){startDemo();return;}
  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  S.mode='live';S.loading=true;
  try{const {data}=await SB.auth.getSession();await setUser(data.session);}catch(e){}
  render();
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY')openNewPassword();
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){setUser(session).then(()=>loadAll(true));}
    else if(ev==='USER_UPDATED'||ev==='TOKEN_REFRESHED'){setUser(session).then(()=>softRender());}
  });
  await loadAll();
  const ch=SB.channel('plugd-live');
  COLLS.forEach(coll=>{ch.on('postgres_changes',{event:'*',schema:'public',table:coll},pl=>{
    if(pl.eventType==='DELETE'){const c={...S.data[coll]};delete c[pl.old.id];S.data[coll]=c;}
    else if(pl.new&&pl.new.id){S.data[coll]={...S.data[coll],[pl.new.id]:{...(pl.new.data||{}),id:pl.new.id}};}
    if(coll==='gigs'&&pl.new&&pl.new.data&&S.me&&(pl.new.data.posterId===S.me||pl.new.data.bookedId===S.me)&&pl.new.data.status==='booked'){clearTimeout(boot.ct);boot.ct=setTimeout(()=>loadAll(true),800);}
    softRender();
  });});
  XC.forEach(coll=>{ch.on('postgres_changes',{event:'*',schema:'public',table:coll},pl=>{
    if(pl.eventType==='DELETE'){if(pl.old&&pl.old.id)xIncoming(coll,{id:pl.old.id},true);}
    else if(pl.new&&pl.new.id)xIncoming(coll,pl.new,false);
  });});
  ch.subscribe();
  setInterval(()=>{if(document.visibilityState==='visible')loadAll(true);},120000);
}
/* ---------- automatic updates ---------- */
const APP_VERSION='2026-11-15.2';
const UPD={ready:''};
async function checkUpdate(){
  if(!/^https?:$/.test(location.protocol)||UPD.ready)return;
  try{
    const r=await fetch('index.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=/const APP_VERSION='([^']+)'/.exec(await r.text());
    if(!m||m[1]===APP_VERSION)return;
    let tried='';try{tried=sessionStorage.getItem('plugd-upd')||'';}catch(e){}
    if(tried===m[1])return;
    UPD.ready=m[1];
    if(document.visibilityState!=='visible'&&!appBusy())return;
    if(!$('#updbar'))document.body.insertAdjacentHTML('beforeend',`<div id="updbar" class="updbar" role="status"><span>A new version of Plug’d is ready.</span><button class="btn sm" data-act="applyupdate">Update now</button></div>`);
  }catch(e){}
}
function appBusy(){const a=document.activeElement;return !$('#modal').hidden||!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));}
async function applyUpdate(){
  try{sessionStorage.setItem('plugd-upd',UPD.ready);}catch(e){}
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}catch(e){}
  location.reload();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(UPD.ready&&!appBusy())applyUpdate();else checkUpdate();
});
setInterval(()=>{if(document.visibilityState==='visible')checkUpdate();},10*60*1000);
setTimeout(checkUpdate,8000);
boot();
})();
